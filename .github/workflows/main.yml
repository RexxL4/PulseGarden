name: Build Pulse Garden

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build PyInstaller executable
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name PulseGarden \
            main.py

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin

          cp dist/PulseGarden AppDir/usr/bin/PulseGarden

      - name: Create desktop entry
        run: |
          cat > AppDir/PulseGarden.desktop <<'EOF'
          [Desktop Entry]
          Name=Pulse Garden
          Comment=An original Python/Pygame rhythm game
          Exec=PulseGarden
          Icon=PulseGarden
          Type=Application
          Categories=Game;
          Terminal=false
          EOF

      - name: Create application icon
        run: |
          python - <<'PY'
          import pygame

          pygame.init()

          surface = pygame.Surface((256, 256), pygame.SRCALPHA)

          surface.fill((20, 20, 30, 255))

          pygame.draw.circle(
              surface,
              (100, 220, 255),
              (128, 128),
              80
          )

          pygame.draw.circle(
              surface,
              (255, 255, 255),
              (128, 128),
              25
          )

          pygame.image.save(
              surface,
              "AppDir/PulseGarden.png"
          )

          pygame.quit()
          PY

      - name: Download appimagetool
        run: |
          wget -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool \
            AppDir \
            PulseGarden-Linux-x86_64.AppImage

      - name: Make AppImage executable
        run: |
          chmod +x PulseGarden-Linux-x86_64.AppImage

      - name: Verify AppImage
        run: |
          ls -lh PulseGarden-Linux-x86_64.AppImage
          file PulseGarden-Linux-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PulseGarden-Linux-AppImage
          path: PulseGarden-Linux-x86_64.AppImage


  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name PulseGarden `
            main.py

      - name: Verify Windows executable
        run: |
          Get-Item dist/PulseGarden.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PulseGarden-Windows
          path: dist/PulseGarden.exe


  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: PulseGarden-Linux-AppImage
          path: release/linux

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: PulseGarden-Windows
          path: release/windows

      - name: Make AppImage executable
        run: |
          chmod +x release/linux/PulseGarden-Linux-x86_64.AppImage

      - name: List release files
        run: |
          find release -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/PulseGarden-Linux-x86_64.AppImage
            release/windows/PulseGarden.exe
          generate_release_notes: true
