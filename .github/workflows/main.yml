name: Build Pulse Garden

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build Linux executable
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name PulseGarden-Linux \
            main.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseGarden-Linux
          path: dist/PulseGarden-Linux


  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name PulseGarden `
            main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseGarden-Windows
          path: dist/PulseGarden.exe


  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: PulseGarden-Linux
          path: release/linux

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: PulseGarden-Windows
          path: release/windows

      - name: Make Linux executable executable
        run: chmod +x release/linux/PulseGarden-Linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/PulseGarden-Linux
            release/windows/PulseGarden.exe
          generate_release_notes: true
